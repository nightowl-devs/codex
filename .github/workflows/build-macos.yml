name: build-macos
on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner label (Blacksmith labels require the Blacksmith GitHub App)'
        required: false
        default: blacksmith-12vcpu-macos-15
        type: choice
        options:
          - blacksmith-12vcpu-macos-15
          - blacksmith-6vcpu-macos-15
          - macos-14

jobs:
  build:
    runs-on: ${{ inputs.runner || 'blacksmith-12vcpu-macos-15' }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: patched-build
      - name: Install pinned toolchain
        working-directory: codex-rs
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: codex-rs
      - name: Build codex-cli (release)
        working-directory: codex-rs
        run: cargo build --release -p codex-cli
      - name: Package
        run: |
          mkdir -p out
          cp codex-rs/target/release/codex out/codex
          shasum -a 256 out/codex | tee out/codex.sha256
          file out/codex
      - uses: actions/upload-artifact@v4
        with:
          name: codex-aarch64-apple-darwin
          path: out/
          if-no-files-found: error
          retention-days: 7
